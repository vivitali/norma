name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

# Without this, every push to a busy PR starts another full review and burns
# API credit on a result that is already obsolete.
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  # claude-code-action authenticates by exchanging a GitHub OIDC token. Without
  # this the action retries three times and fails the job with "Unable to get
  # ACTIONS_ID_TOKEN_REQUEST_URL env variable" — on every PR, regardless of its
  # contents. GitHub only injects that variable when id-token: write is granted.
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Forks receive empty secrets on pull_request, so the key would be blank.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action tries to mint a Claude Code GitHub App
          # token to post its review, and fails with "401 Unauthorized - Claude
          # Code is not installed on this repository". The workflow's own token
          # already carries the pull-requests: write granted above, so the App
          # installation is not needed. Install the App at
          # https://github.com/apps/claude and this line can go.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request against the conventions in CLAUDE.md and
            AGENTS.md at the repo root.

            Pay particular attention to:
            - Province and jurisdiction rules must live in src/domain/jurisdictions/,
              never inlined in components.
            - User-facing strings must come from messages/en.json and messages/fr.json
              via next-intl, never hardcoded in JSX.
            - Every page route must stay prerendered; flag anything that would make a
              route server-rendered on demand.
            - Locale routing lives in src/middleware.ts, not src/proxy.ts. Renaming it
              back to proxy.ts breaks deployment — see the note in CLAUDE.md.
            - Tests must accompany behavior changes.

            Report only issues you are confident about. Skip style nits already
            covered by eslint.
