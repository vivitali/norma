name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Re-run the gate rather than trusting the PR run: main can move between
      # a PR passing and its merge landing.
      - run: ./scripts/check
      - run: ./scripts/verify-prerender

      - run: ./scripts/ship
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Web Analytics site TOKEN — the `token` in the dashboard's JS
          # snippet, not the site TAG. The tag (67df29e1…) is what the dashboard
          # URL and GraphQL's `siteTag` show, so it is the one that gets copied;
          # the beacon accepts it, POSTs every pageview, and cloudflareinsights.com
          # answers 503. That shipped from 2026-08-26 (3a3a21a) to 2026-10-25 and
          # recorded zero pageviews. Verify a change here in the browser's network tab: the
          # POST to /cdn-cgi/rum must return 204.
          #
          # Not a secret — it is served in the page source to every visitor by
          # design; a secret here would only add a silent-failure mode when it is
          # missing. Inlined at build time, so it has to be present for this
          # step, not at runtime.
          #
          # Set only on production: preview builds would report into the same
          # dataset and make the numbers meaningless.
          NEXT_PUBLIC_CF_BEACON_TOKEN: 0d96c384aaa54172b19abc103556eb04

      # Production is affordmath.com; workers.dev is disabled for this Worker.
      #
      # This step exists because of a real incident: a deploy passed lint, typecheck,
      # 116 tests, the prerender guard, and `wrangler deploy --dry-run`, and still
      # served 404 on every page — the adapter needs an incremental cache to serve
      # prerendered HTML. Nothing short of an HTTP request against the deployed
      # Worker could catch that, so CI now makes that request.
      - name: Smoke-test production
        run: ./scripts/smoke https://affordmath.com
