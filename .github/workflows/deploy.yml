name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Re-run the gate rather than trusting the PR run: main can move between
      # a PR passing and its merge landing.
      - run: ./scripts/check
      - run: ./scripts/verify-prerender

      - run: ./scripts/ship
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Production is affordmath.com; workers.dev is disabled for this Worker.
      #
      # This step exists because of a real incident: a deploy passed lint, typecheck,
      # 116 tests, the prerender guard, and `wrangler deploy --dry-run`, and still
      # served 404 on every page — the adapter needs an incremental cache to serve
      # prerendered HTML. Nothing short of an HTTP request against the deployed
      # Worker could catch that, so CI now makes that request.
      - name: Smoke-test production
        run: ./scripts/smoke https://affordmath.com
